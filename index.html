<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Blood Lagbe | Find blood donors near you in minutes</title>
    <meta
      name="description"
      content="Blood Lagbe connects families in an emergency with registered blood donors across your city. Search by blood group, see who is nearby and available, and call them directly. Always free for seekers."
    />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d92d20" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blood Lagbe" />
    <meta property="og:title" content="Blood Lagbe | Find blood donors near you in minutes" />
    <meta
      property="og:description"
      content="Pick a blood group, see verified donors near you who are available right now, and call them directly. No middlemen, no fees."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:url" content="https://bloodlagbe.com.bd/" />
    <link rel="canonical" href="https://bloodlagbe.com.bd/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blood Lagbe | Find blood donors near you in minutes" />
    <meta
      name="twitter:description"
      content="Pick a blood group, see available donors near you, and call them directly. Always free for seekers."
    />
    <script>
      // Set theme before paint to avoid a flash
      try {
        var stored = localStorage.getItem('bl-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Blood Lagbe",
        "url": "https://bloodlagbe.com.bd",
        "description": "Blood Lagbe connects families in an emergency with verified, available blood donors near them."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
